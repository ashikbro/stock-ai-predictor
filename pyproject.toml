[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ai-predictor"
version = "0.1.0"
description = "Deterministic, cost-aware stock prediction research baseline"
requires-python = ">=3.10"

[project.scripts]
stock-baseline = "stock_ai_predictor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
